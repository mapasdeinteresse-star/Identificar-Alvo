<iframe src="./imagens/teste.jpg" width="100%" height="500px"></iframe>

<script>
  // manda lat/lng pro backend
  function enviarLocalizacao(lat, lng) {
    fetch('/api/salvar-localizacao', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        latitude: lat,
        longitude: lng
      })
    })
    .then(response => response.json())
    .then(data => console.log('Servidor respondeu:', data))
    .catch(error => console.error('Erro na requisição:', error));
  }

  // pede permissão de gps ao navegador
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        enviarLocalizacao(lat, lng);
      },
      (error) => {
        console.error("Erro ao obter localização:", error.message);
      },
      {
        enableHighAccuracy: true,
        timeout: 5000,
        maximumAge: 0
      }
    );
  } else {
    console.error("Geolocalização não é suportada neste navegador.");
  }
</script>
